{% extends 'dashboard/dashboard.html' %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a href="{% url 'admin' %}">Dashboard</a></li>
    <li class="breadcrumb-item"><a href="{% url 'partner_list' %}">Partners</a></li>
    <li class="breadcrumb-item active">Add Partner</li>
  </ol>
</nav>

<div class="container mt-4">
    <div class="card shadow-sm border-0" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-white pt-4 pb-2 border-0">
            <h4 class="fw-bold text-primary mb-0"><i class="bi bi-person-plus"></i> Register New Partner</h4>
        </div>
        <div class="card-body px-4 pb-4">
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold small">Company / Branch Name</label>
                    <input type="text" name="name" class="form-control bg-light" required placeholder="e.g. Solar Nexus Delhi">
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-bold small">Partner Type</label>
                        <select name="partner_type" class="form-select bg-light" required>
                            <option value="franchise">Franchise</option>
                            <option value="dealer">Dealer</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-bold small">Commission Rate (%)</label>
                        <input type="number" step="0.01" name="commission_rate" class="form-control bg-light" value="0.00" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted fw-bold small">Contact Person</label>
                    <input type="text" name="contact_person" class="form-control bg-light" required placeholder="Full name">
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-bold small">Phone</label>
                        <input type="text" name="phone" class="form-control bg-light" required placeholder="+91">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-bold small">Email</label>
                        <input type="email" name="email" class="form-control bg-light" placeholder="optional">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted fw-bold small">Address</label>
                    <textarea name="address" class="form-control bg-light" rows="3" placeholder="Full address"></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'partner_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Save Partner</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
