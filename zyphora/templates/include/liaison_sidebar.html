
{% load static %}

<!-- ================= SIDEBAR ================= -->
<nav id="sidebar" class="sidebar bg-body-tertiary border-end">

    <!-- ===== HEADER (LOGO + TOGGLE) ===== -->
    <div class="sidebar-header d-flex align-items-center justify-content-between px-3 py-2">

        <!-- Logo Full (Expanded State) -->
        <a href="{% url 'dashboard' %}" class="sidebar-logo-full text-decoration-none d-flex align-items-center">
            <img src="{% static 'images/kiana-green-logo.png' %}" alt="Kiana Green Logo"
                style="max-height: 42px; width: auto; object-fit: contain;">
        </a>

        <!-- Logo Mini (Collapsed State) -->
        <a href="{% url 'dashboard' %}" class="sidebar-logo-mini text-decoration-none d-none align-items-center justify-content-center" title="Dashboard">
            <img src="{% static 'images/favicon.png' %}" alt="Zyphora"
                style="width: 36px; height: 36px; object-fit: contain; border-radius: 8px;">
        </a>

        <!-- Sidebar Toggle: ONLY on desktop. On mobile, hamburger in topnavbar is used. -->
        <label for="sidebarToggleCheckbox" class="toggle-btn d-none d-lg-flex align-items-center justify-content-center" title="Toggle Sidebar">
            <i class="bi bi-chevron-left arrow-icon"></i>
        </label>

    </div>

    <!-- ===== SIDEBAR MENU ===== -->
    <ul class="nav flex-column px-3" id="sidebarMenu">

        <!-- Dashboard -->
        <li class="nav-item">
            <a href="{% url 'dashboard' %}" class="nav-link d-flex align-items-center {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
               data-bs-toggle="tooltip" data-bs-placement="right" title="Dashboard">
                <i class="bi bi-grid-1x2-fill nav-icon"></i>
                <span class="link-text ms-2">Dashboard</span>
            </a>
        </li>

        <!-- Licensing -->
        <li class="nav-item mt-2">
            <a href="{% url 'licensing_list' %}" class="nav-link d-flex align-items-center {% if request.resolver_match.url_name == 'licensing_list' %}active{% endif %}">
                <i class="bi bi-file-earmark-check nav-icon"></i>
                <span class="link-text ms-2">Licensing</span>
            </a>
        </li>

        <!-- My Projects  -->
        <li class="nav-item mt-2">
            <a href="{% url 'project_list' %}" class="nav-link d-flex align-items-center {% if request.resolver_match.url_name == 'project_list' %}active{% endif %}">
                <i class="bi bi-kanban nav-icon"></i>
                <span class="link-text ms-2">Projects</span>
            </a>
        </li>

        <!-- Notifications -->
        <li class="nav-item mt-3">
            <a href="{% url 'notifications' %}" class="nav-link d-flex align-items-center {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}">
                <i class="bi bi-bell nav-icon"></i>
                <span class="link-text ms-2">Notifications</span>
            </a>
        </li>

        <!-- ================= PROFILE ================= -->        
        <li class="nav-item mt-3">
            <a href="{% url 'profile' %}" class="nav-link d-flex align-items-center {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
                <i class="bi bi-person-circle nav-icon"></i>
                <span class="link-text ms-2">My Profile</span>
            </a>
        </li>
        
    </ul>

</nav>
