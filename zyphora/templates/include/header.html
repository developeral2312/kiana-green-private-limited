{% load static %}
<nav class="navbar navbar-expand-lg navbar-light custom-navbar fixed-top">
  <div class="container px-4" style="max-width: 1600px;">
    <!-- Brand Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
      <img src="{% static 'images/kiana-green-logo.png' %}" alt="Kiana Green Logo" style="height: 50px; width: auto;">
    </a>

    <!-- Mobile Toggler -->
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav Links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto align-items-center">
        {% url 'home' as url_home %}
        {% url 'about' as url_about %}
        {% url 'products' as url_products %}
        {% url 'services' as url_services %}
        {% url 'contact' as url_contact %}

        <li class="nav-item"><a class="nav-link {% if request.path == url_home %}active{% endif %}" href="{{ url_home }}">Home</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == url_about %}active{% endif %}" href="{{ url_about }}">About</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == url_products %}active{% endif %}" href="{{ url_products }}">Products</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == url_services %}active{% endif %}" href="{{ url_services }}">Services</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == url_contact %}active{% endif %}" href="{{ url_contact }}">Contact</a></li>
      </ul>

      <!-- Right-aligned CTA Buttons -->
      <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 mt-3 mt-lg-0">
        <a class="btn btn-kiana-primary px-4 py-2 rounded-pill text-white fw-bold text-center" href="{% url 'contact' %}">
          Get Free Quote
        </a>
        <a class="btn btn-outline-success px-3 py-2 rounded-pill fw-bold text-success text-center" href="{% url 'login' %}">
          <i class="bi bi-person-circle me-1"></i> Team Portal
        </a>
      </div>
    </div>
  </div>
</nav>
