<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GREEN PRIVATE LIMITED | Team Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Added v=3 cache buster to make sure browser loads the new CSS -->
    <link rel="stylesheet" href="/static/css/public_view/login.css?v=3">
</head>

<body>
<div class="login-wrapper">
    <div class="glass-card">
        
        <div class="text-center mb-4">
            <h2 class="mb-2">
                <a href="{% url 'home' %}" class="text-decoration-none">
                    <span class="brand-title">Kiana Green <span class="text-warning">Solar</span></span>
                </a>
            </h2>
            <p class="subtitle"><i class="fas fa-shield-alt me-2"></i>Secure Staff Login Portal</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="mb-4 position-relative">
                <i class="fas fa-user position-absolute top-50 translate-middle-y text-white-50" style="left: 18px; font-size: 1.1rem;"></i>
                <input type="text" 
                       name="username" 
                       class="form-control form-control-glass ps-5" 
                       placeholder="Enter Username or Email" 
                       required>
            </div>

            <div class="mb-4 position-relative">
                <i class="fas fa-lock position-absolute top-50 translate-middle-y text-white-50" style="left: 18px; font-size: 1.1rem;"></i>
                <input type="password" 
                       name="password" 
                       class="form-control form-control-glass ps-5" 
                       placeholder="Enter Password" 
                       required>
            </div>

            <div class="d-grid mt-2">
                <button type="submit" class="btn btn-glass d-flex align-items-center justify-content-center">
                    Authenticate <i class="fas fa-sign-in-alt ms-2"></i>
                </button>
            </div>

            {% if messages %}
            <div class="mt-4">
                {% for message in messages %}
                <div class="alert alert-danger text-center border-0 py-2" style="background: rgba(220, 53, 69, 0.2); border-left: 4px solid #dc3545 !important; color: #ffcccc; backdrop-filter: blur(5px);">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
